<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f7f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#187a58;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#126448;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGradient)" />

  <circle cx="1100" cy="260" r="140" fill="#e5f3eb" opacity="0.6" />
  <circle cx="1150" cy="60" r="90" fill="#e5f3eb" opacity="0.4" />
  <circle cx="80" cy="280" r="100" fill="#dce5d8" opacity="0.5" />

  <path d="M 40 160 Q 60 140, 80 160 T 120 160 T 160 160 T 200 160" 
        fill="none" stroke="#187a58" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  <path d="M 1000 140 Q 1020 120, 1040 140 T 1080 140 T 1120 140 T 1160 140" 
        fill="none" stroke="#187a58" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <g filter="url(#softShadow)">
    <rect x="40" y="100" width="200" height="60" rx="12" fill="#ffffff" />
    <text x="56" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#244637" letter-spacing="-0.5">MTAA</text>
    <text x="56" y="156" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#187a58" letter-spacing="0.5">FIX</text>
  </g>

  <text x="40" y="210" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#244637" letter-spacing="-1">Mtaa Fix</text>
  <text x="40" y="242" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#687468" letter-spacing="0">Community Reporting &amp; Accountability System</text>
  <text x="40" y="272" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#687468" letter-spacing="0">Kisii County, Kenya  ·  Civic issue reporting  ·  Government accountability</text>

  <rect x="40" y="290" width="14" height="14" fill="#187a58" rx="3" />
  <rect x="60" y="290" width="14" height="14" fill="#126448" rx="3" />
  <rect x="80" y="290" width="14" height="14" fill="#e5f3eb" rx="3" />
  <rect x="100" y="290" width="14" height="14" fill="#dce5d8" rx="3" />

  <line x1="40" y1="295" x2="380" y2="295" stroke="#dce5d8" stroke-width="1" />
</svg>
