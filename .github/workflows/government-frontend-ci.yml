name: Government Frontend CI

on:
  push:
    paths:
      - "government-frontend/**"
      - ".github/workflows/government-frontend-ci.yml"
  pull_request:
    paths:
      - "government-frontend/**"
      - ".github/workflows/government-frontend-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: government-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: government-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
